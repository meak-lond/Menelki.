name: Application Android

on:
  push:
    branches: [application-android, main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature (seulement si les secrets existent)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/menelki.jks"
            echo "MENELKI_KEYSTORE_FILE=$RUNNER_TEMP/menelki.jks" >> "$GITHUB_ENV"
            echo "Clé de signature trouvée : l'application sera signée."
          else
            echo "Pas de clé de signature : application de test uniquement."
          fi

      - name: Compiler (test + version Google Play)
        working-directory: android
        env:
          MENELKI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MENELKI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MENELKI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: menelki-test-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: menelki-google-play-aab
          path: android/app/build/outputs/bundle/release/*.aab
